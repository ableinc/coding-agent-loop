<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>coding-agent-loop</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="lock-screen" class="lock" hidden>
    <form id="lock-form" class="lock-card">
      <h1>coding-agent-loop</h1>
      <input id="lock-password" type="password" placeholder="Password" autocomplete="current-password" autofocus required />
      <button type="submit" class="btn btn-primary">Unlock</button>
      <p id="lock-error" class="lock-error" role="alert" hidden></p>
    </form>
  </div>

  <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden></div>

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">coding-agent-loop</span>
      <span id="status-pill" class="pill pill-neutral" aria-live="polite">connecting&hellip;</span>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#/" data-route="/">Dashboard</a>
      <a href="#/runs" data-route="/runs">Runs</a>
      <a href="#/sessions" data-route="/sessions">Sessions</a>
      <a href="#/config" data-route="/config">Config</a>
    </nav>
    <div class="topbar-right">
      <button id="poll-now-btn" class="btn" type="button">Run discovery now</button>
      <button id="pause-resume-btn" class="btn" type="button">Pause</button>
      <select id="poll-interval" class="select" aria-label="Refresh interval">
        <option value="2000">2s</option>
        <option value="5000" selected>5s</option>
        <option value="15000">15s</option>
        <option value="0">Off</option>
      </select>
      <button id="theme-toggle-btn" class="btn btn-icon" type="button" aria-label="Toggle dark mode">&#9788;</button>
      <button id="lock-btn" class="btn" type="button" hidden>Lock</button>
    </div>
  </header>

  <main id="app">
    <section id="view-dashboard" class="view" hidden></section>
    <section id="view-runs" class="view" hidden></section>
    <section id="view-run-detail" class="view" hidden></section>
    <section id="view-sessions" class="view" hidden></section>
    <section id="view-config" class="view" hidden></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
