# nginx reverse proxy for coding-agent-loop's control API + web console.
#
# The daemon (see coding-agent-loop.service) binds to 127.0.0.1:8787 by
# default and has no transport security of its own — server.password gates
# requests but everything travels in plaintext. This fronts it with TLS and a
# real hostname so the console can be reached off-box, while the upstream
# stays loopback-only and unreachable directly.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/coding-agent-loop.conf
#   sudo ln -s /etc/nginx/sites-available/coding-agent-loop.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace agent-loop.example.com and the cert paths below, then obtain a
# certificate (e.g. `certbot --nginx -d agent-loop.example.com`) before
# enabling the HTTPS server block. Set server.password in config.json before
# exposing this beyond localhost — the API has no other access control.

upstream coding_agent_loop {
    server 127.0.0.1:8787;
    keepalive 16;
}

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name agent-loop.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agent-loop.example.com;

    ssl_certificate     /etc/letsencrypt/live/agent-loop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-loop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # The console ships no secrets in its bundle, but keep it out of caches
    # and other sites regardless — it's an operator control surface.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/coding-agent-loop.access.log;
    error_log  /var/log/nginx/coding-agent-loop.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://coding_agent_loop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /runs/:id/log serves a growing JSONL transcript; give it room to
        # sit on a slow connection instead of timing out mid-download.
        proxy_read_timeout 120s;
    }
}
